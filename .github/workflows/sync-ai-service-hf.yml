name: Sync AI Service to Hugging Face Spaces

on:
  push:
    branches:
      - main
    paths:
      - "ai-service/**"
      - ".github/workflows/sync-ai-service-hf.yml"
  workflow_dispatch:

jobs:
  sync-to-hf:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Periksa konfigurasi Hugging Face
        id: check
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID || secrets.HF_SPACE_ID }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE_ID" ]; then
            echo "HF_TOKEN atau HF_SPACE_ID belum disetel di GitHub Secrets/Variables. Sinkronisasi dilewati."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.check.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Sinkronkan folder ai-service ke Hugging Face Space
        if: steps.check.outputs.ready == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID || secrets.HF_SPACE_ID }}
        run: |
          SPACE_CLEAN=$(printf '%s' "$HF_SPACE_ID" | tr -d '[:space:]' | sed -E 's|^https?://huggingface\.co/spaces/||; s|^/+||; s|/+$||')
          SPACE_REPO="https://user:${HF_TOKEN}@huggingface.co/spaces/${SPACE_CLEAN}"

          rm -rf /tmp/hf-space
          git lfs install
          git clone --quiet "$SPACE_REPO" /tmp/hf-space

          rsync -av --delete \
            --exclude='.git' \
            --exclude='.gitattributes' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.venv' \
            --exclude='__pycache__' \
            ai-service/ /tmp/hf-space/

          if [ -f ai-service/.env.example ]; then
            cp ai-service/.env.example /tmp/hf-space/.env.example
          fi

          cd /tmp/hf-space
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan pada ai-service/ untuk disinkronkan."
            exit 0
          fi

          git commit -m "chore(ai-service): sync from GitHub ${GITHUB_SHA::7}"
          git push --quiet origin main
          echo "Berhasil sinkronisasi ai-service ke Hugging Face Space: ${SPACE_CLEAN}"

name: Keep-Alive AI Service

on:
  schedule:
    # Ping /health setiap 10 menit agar server backend gratis (Render / HF) tetap aktif tanpa cold start
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      ai_service_url:
        description: "URL publik backend AI Service (opsional untuk uji manual)"
        required: false
        type: string

env:
  # Isi URL publik backend AI Service setelah deploy selesai (contoh: https://nutriva-ai.onrender.com)
  AI_SERVICE_URL: ""

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping endpoint /health AI Service
        env:
          INPUT_URL: ${{ inputs.ai_service_url }}
        run: |
          TARGET_BASE="${INPUT_URL:-$AI_SERVICE_URL}"
          if [ -z "$TARGET_BASE" ]; then
            echo "AI_SERVICE_URL belum diisi. Melewati ping keep-alive."
            exit 0
          fi

          TARGET="${TARGET_BASE%/}/health"
          echo "Memanggil $TARGET ..."
          touch /tmp/health.json
          HTTP_CODE=$(curl -sS -m 60 -o /tmp/health.json -w "%{http_code}" "$TARGET") || HTTP_CODE="000"
          [ -s /tmp/health.json ] && cat /tmp/health.json && echo ""

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::warning::Health check mengembalikan HTTP $HTTP_CODE (server mungkin sedang bangun atau build)."
            exit 1
          fi

          echo "Backend AI Service aktif (HTTP 200)."

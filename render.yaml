services:
  - type: web
    name: nutriva-ai
    runtime: docker
    rootDir: ai-service
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: ENABLE_DOCS
        value: "false"
      - key: AUTH_MODE
        value: supabase
      - key: SUPABASE_URL
        value: https://nfptdnxmcidkbinwhshq.supabase.co
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-3.5-flash
      - key: LLM_JSON_MODE
        value: "true"
      - key: LLM_MAX_TOKENS
        value: "2048"
      - key: LLM_TIMEOUT_S
        value: "60"
      - key: ALLOWED_ORIGINS
        value: https://nutriva-app.netlify.app
      - key: ALLOWED_ORIGIN_REGEX
        value: ^https://([a-z0-9-]+--)?[a-z0-9-]+\.netlify\.app$
      - key: LLM_API_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
